<!doctype html>
<!-- ============================================================================
     index.html: THE ONE HTML PAGE OF THE WEBSITE
     It is almost empty on purpose: React fills the <div id="root"> using
     src/main.tsx. This is called a "single-page app".
     ============================================================================ -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vinyl Tracker</title>
    <!-- The little record in the browser tab. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- What search engines and link previews (chat apps, social media) show. -->
    <meta
      name="description"
      content="A diary for your record collection: track the vinyl you own, log what you play, and see stats, stylus wear, value and recommendations."
    />
    <meta property="og:title" content="Vinyl Tracker" />
    <meta
      property="og:description"
      content="A diary for your record collection: track the vinyl you own, log what you play, and see stats, stylus wear, value and recommendations."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#b4441b" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
