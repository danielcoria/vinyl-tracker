# ============================================================================
# ci.yml: CI: AUTOMATIC CHECKS ON GITHUB
#
# Every time you push to main (or open a pull request), GitHub starts a
# fresh computer, installs the project and runs two jobs side by side:
#   check  format check, lint, typecheck, tests and build (on Node 22 and 24)
#   e2e    the end-to-end tests: a real browser clicking through the real app
# A green check = everything passed.
# See the results in the "Actions" tab of the repo on GitHub.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks code, it never writes to the repo.
permissions:
  contents: read

# A new push to the same branch/PR cancels the run that's still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (package.json engines) and the version used locally (.nvmrc).
        node: [22, 24]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser the tests drive, plus the system libraries it needs on Linux.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      # If something failed, keep the report (with screenshots and step-by-step
      # traces) so it can be downloaded from the run's page on GitHub.
      - name: Save the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
